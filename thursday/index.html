<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5d547" />
  <title>Is it Thursday?</title>

  <style>
    :root {
      --yellow: #f5d547;
      --soft-yellow: #fff6bf;
      --green: #6a9f58;
      --dark-green: #355b2f;
      --cream: #fffdf6;
      --text: #24301f;
      --muted: rgba(36, 48, 31, 0.7);
      --card: rgba(255, 255, 255, 0.88);
      --shadow: 0 24px 60px rgba(53, 91, 47, 0.17);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(245, 213, 71, 0.45), transparent 34%),
        radial-gradient(circle at 85% 10%, rgba(223, 242, 255, 0.95), transparent 30%),
        radial-gradient(circle at bottom right, rgba(106, 159, 88, 0.25), transparent 35%),
        linear-gradient(135deg, #fffdf6 0%, #f7f7eb 100%);
    }

    .card {
      position: relative;
      width: min(760px, 100%);
      padding: clamp(32px, 8vw, 72px);
      text-align: center;
      overflow: hidden;
      background: var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(53, 91, 47, 0.1);
      border-radius: 34px;
      box-shadow: var(--shadow);
    }

    .card::before {
      content: "THURSDAY";
      position: absolute;
      left: 50%;
      bottom: -0.2em;
      transform: translateX(-50%);
      font-size: clamp(4.5rem, 17vw, 9rem);
      line-height: 1;
      font-weight: 950;
      letter-spacing: -0.09em;
      color: rgba(245, 213, 71, 0.13);
      pointer-events: none;
      white-space: nowrap;
    }

    .badge {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      padding: 9px 15px;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--dark-green);
      background: var(--soft-yellow);
      border: 1px solid rgba(53, 91, 47, 0.12);
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: clamp(4.5rem, 18vw, 9rem);
      line-height: 0.9;
      letter-spacing: -0.075em;
      color: var(--dark-green);
    }

    .message {
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin: 28px auto 0;
      font-size: clamp(1.15rem, 3vw, 1.55rem);
      line-height: 1.45;
      font-weight: 700;
    }

    .countdown {
      position: relative;
      z-index: 1;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 700;
    }

    .heart {
      display: inline-block;
      animation: heartbeat 1.6s ease-in-out infinite;
    }

    .tiny-note {
      position: relative;
      z-index: 1;
      margin-top: 34px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .sparkle {
      position: fixed;
      font-size: clamp(1.2rem, 3vw, 2rem);
      opacity: 0;
      pointer-events: none;
      animation: float 4.5s ease-in-out infinite;
    }

    .sparkle:nth-child(1) { left: 8%; top: 18%; animation-delay: 0s; }
    .sparkle:nth-child(2) { right: 9%; top: 22%; animation-delay: 0.8s; }
    .sparkle:nth-child(3) { left: 13%; bottom: 16%; animation-delay: 1.6s; }
    .sparkle:nth-child(4) { right: 13%; bottom: 15%; animation-delay: 2.4s; }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.18); }
      30% { transform: scale(1); }
      45% { transform: scale(1.12); }
      60% { transform: scale(1); }
    }

    @keyframes float {
      0%, 100% {
        opacity: 0;
        transform: translateY(12px) rotate(-8deg);
      }
      25%, 75% {
        opacity: 0.75;
      }
      50% {
        opacity: 1;
        transform: translateY(-12px) rotate(8deg);
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 14px;
      }

      .card {
        padding: 36px 22px 42px;
        border-radius: 28px;
      }
    }
  </style>
</head>

<body>
  <div class="sparkle">✨</div>
  <div class="sparkle">💛</div>
  <div class="sparkle">✨</div>
  <div class="sparkle">🌿</div>

  <main class="card">
    <div class="badge" id="dateBadge">Checking Copenhagen time…</div>
    <h1 id="answer">...</h1>
    <p class="message" id="message"></p>
    <p class="countdown" id="countdown"></p>
    <p class="tiny-note">Made by a very impatient boyfriend.</p>
  </main>

  <script>
    const TIME_ZONE = "Europe/Copenhagen";

    function getCopenhagenParts(date = new Date()) {
      const formatter = new Intl.DateTimeFormat("en-GB", {
        timeZone: TIME_ZONE,
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      });

      const parts = formatter.formatToParts(date);
      return Object.fromEntries(parts.map(part => [part.type, part.value]));
    }

    function getCopenhagenWeekday(date = new Date()) {
      return new Intl.DateTimeFormat("en-US", {
        timeZone: TIME_ZONE,
        weekday: "long"
      }).format(date);
    }

    function getNextThursdayStart(now = new Date()) {
      const weekdayIndex = {
        Sunday: 0,
        Monday: 1,
        Tuesday: 2,
        Wednesday: 3,
        Thursday: 4,
        Friday: 5,
        Saturday: 6
      };

      const currentDay = weekdayIndex[getCopenhagenWeekday(now)];
      let daysUntilThursday = (4 - currentDay + 7) % 7;

      if (daysUntilThursday === 0) {
        daysUntilThursday = 7;
      }

      const copenhagenDate = new Intl.DateTimeFormat("en-CA", {
        timeZone: TIME_ZONE,
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(now);

      const [year, month, day] = copenhagenDate.split("-").map(Number);

      // Noon UTC avoids edge cases around daylight-saving transitions.
      const base = new Date(Date.UTC(year, month - 1, day, 12));
      base.setUTCDate(base.getUTCDate() + daysUntilThursday);

      const targetDate = new Intl.DateTimeFormat("en-CA", {
        timeZone: "UTC",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(base);

      // Convert midnight in Copenhagen on the target date to a UTC instant.
      const probe = new Date(`${targetDate}T00:00:00Z`);
      const zonedHour = Number(new Intl.DateTimeFormat("en-GB", {
        timeZone: TIME_ZONE,
        hour: "2-digit",
        hour12: false
      }).format(probe));

      return new Date(probe.getTime() - zonedHour * 60 * 60 * 1000);
    }

    function formatDuration(ms) {
      const totalSeconds = Math.max(0, Math.floor(ms / 1000));
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      const pieces = [];
      if (days) pieces.push(`${days} day${days === 1 ? "" : "s"}`);
      pieces.push(`${hours}h`, `${minutes}m`, `${seconds}s`);
      return pieces.join(" ");
    }

    function updatePage() {
      const now = new Date();
      const parts = getCopenhagenParts(now);
      const isThursday = parts.weekday === "Thursday";

      document.getElementById("dateBadge").textContent =
        `${parts.weekday}, ${parts.day} ${parts.month} · Copenhagen`;

      const answer = document.getElementById("answer");
      const message = document.getElementById("message");
      const countdown = document.getElementById("countdown");

      if (isThursday) {
        answer.textContent = "YES!";
        message.innerHTML =
          `It is finally Thursday, which means I get to see Beli today <span class="heart">💛</span>`;
        countdown.textContent =
          "The waiting is over. Best day of the week officially activated.";
      } else {
        answer.textContent = "NO";
        message.innerHTML =
          `Unfortunately not yet. But every second brings me closer to seeing Beli <span class="heart">💛</span>`;

        const nextThursday = getNextThursdayStart(now);
        countdown.textContent =
          `Thursday begins in ${formatDuration(nextThursday - now)}.`;
      }
    }

    updatePage();
    setInterval(updatePage, 1000);
  </script>
</body>
</html>
