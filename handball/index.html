<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Håndboldliga Tips 2026/27</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root{
      --bg:#12161d;
      --surface:#1b212b;
      --surface-2:#232a36;
      --surface-3:#2a3140;
      --border:#2f3746;
      --text:#eef1f5;
      --muted:#8993a4;

      --henrik:#2dd4bf;
      --henrik-dim:#134e4a;

      --steen:#ffb703;
      --steen-dim:#5c4308;

      --success:#4ade80;
      --danger:#f87171;
      --info:#60a5fa;

      --court-line:rgba(255,255,255,0.06);
    }

    *{
      box-sizing:border-box;
    }

    html,body{
      margin:0;
      padding:0;
    }

    body{
      background:
        radial-gradient(
          circle at 15% -10%,
          rgba(45,212,191,0.08),
          transparent 45%
        ),
        radial-gradient(
          circle at 90% 0%,
          rgba(255,183,3,0.08),
          transparent 40%
        ),
        var(--bg);

      color:var(--text);
      font-family:'Inter',system-ui,-apple-system,sans-serif;
      min-height:100vh;
    }

    h1,h2,h3,.display{
      font-family:'Oswald',system-ui,sans-serif;
      text-transform:uppercase;
      letter-spacing:0.03em;
      font-weight:600;
      margin:0;
    }

    .mono{
      font-family:'Roboto Mono',monospace;
    }

    .wrap{
      max-width:1000px;
      margin:0 auto;
      padding:0 16px 64px;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    header.top{
      border-bottom:1px solid var(--border);
      background:linear-gradient(
        180deg,
        rgba(255,255,255,0.02),
        transparent
      );
      padding:20px 0 0;
    }

    .brand{
      display:flex;
      align-items:center;
      justify-content:space-between;
      max-width:1000px;
      margin:0 auto;
      padding:0 16px;
    }

    .brand h1{
      font-size:20px;
      letter-spacing:0.06em;
    }

    .brand h1 span{
      color:var(--steen);
    }

    .sync-pill{
      font-size:11px;
      color:var(--muted);
      border:1px solid var(--border);
      border-radius:999px;
      padding:4px 10px;
      display:flex;
      align-items:center;
      gap:6px;
      white-space:nowrap;
    }

    .sync-dot{
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--muted);
    }

    .sync-pill.on .sync-dot{
      background:var(--success);
    }

    .sync-pill.off .sync-dot{
      background:var(--danger);
    }

    .scoreboard{
      max-width:1000px;
      margin:18px auto 0;
      padding:0 16px;
    }

    .scoreboard-panel{
      background:linear-gradient(
        180deg,
        var(--surface-2),
        var(--surface)
      );

      border:1px solid var(--border);
      border-radius:14px;
      padding:18px 22px;

      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:14px;

      position:relative;
      overflow:hidden;
    }

    .scoreboard-panel::before{
      content:"";
      position:absolute;
      inset:0;

      background-image:repeating-linear-gradient(
        90deg,
        var(--court-line) 0 1px,
        transparent 1px 46px
      );

      pointer-events:none;
    }

    .sb-player{
      text-align:center;
      position:relative;
      z-index:1;
    }

    .sb-player .name{
      font-size:13px;
      color:var(--muted);
      letter-spacing:0.08em;
      text-transform:uppercase;
    }

    .sb-player .pts{
      font-family:'Roboto Mono',monospace;
      font-weight:700;
      font-size:42px;
      line-height:1;
      margin-top:4px;
    }

    .sb-player.henrik .pts{
      color:var(--henrik);
      text-shadow:0 0 18px rgba(45,212,191,0.35);
    }

    .sb-player.steen .pts{
      color:var(--steen);
      text-shadow:0 0 18px rgba(255,183,3,0.35);
    }

    .sb-vs{
      position:relative;
      z-index:1;

      font-family:'Oswald',sans-serif;
      color:var(--muted);
      font-size:13px;
      letter-spacing:0.15em;
    }

    /* =========================================================
       NAV
       ========================================================= */

    nav.tabs{
      max-width:1000px;
      margin:18px auto 0;
      padding:0 16px;

      display:flex;
      gap:6px;
      flex-wrap:wrap;
    }

    nav.tabs button{
      background:var(--surface);
      border:1px solid var(--border);
      color:var(--muted);

      padding:9px 14px;
      border-radius:9px;

      font-family:'Oswald',sans-serif;
      font-size:12.5px;
      letter-spacing:0.05em;
      text-transform:uppercase;

      cursor:pointer;
      transition:all .15s;
    }

    nav.tabs button:hover{
      color:var(--text);
      border-color:var(--surface-3);
    }

    nav.tabs button.active{
      background:var(--surface-3);
      color:var(--text);
      border-color:var(--steen);
    }

    main{
      max-width:1000px;
      margin:22px auto 0;
      padding:0 16px;
    }

    /* =========================================================
       GENERIC
       ========================================================= */

    .card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:12px;
      padding:16px 18px;
      margin-bottom:14px;
    }

    .card h2{
      font-size:16px;
      color:var(--text);
      margin-bottom:2px;
    }

    .subtle{
      color:var(--muted);
      font-size:13px;
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    .row.between{
      justify-content:space-between;
    }

    select,
    input[type=text],
    input[type=number],
    input[type=datetime-local]{
      background:var(--surface-2);
      border:1px solid var(--border);
      color:var(--text);

      padding:8px 10px;
      border-radius:7px;

      font-family:'Inter',sans-serif;
      font-size:14px;
    }

    select{
      max-width:100%;
    }

    select:focus,
    input:focus{
      outline:2px solid var(--steen);
      outline-offset:1px;
    }

    input[type=number]{
      width:64px;
      font-family:'Roboto Mono',monospace;
      text-align:center;
    }

    button.btn{
      background:var(--surface-3);
      border:1px solid var(--border);
      color:var(--text);

      padding:8px 14px;
      border-radius:7px;

      font-family:'Oswald',sans-serif;
      text-transform:uppercase;
      letter-spacing:0.04em;
      font-size:12.5px;

      cursor:pointer;
    }

    button.btn:hover{
      border-color:var(--steen);
    }

    button.btn.primary{
      background:var(--steen);
      color:#1a1400;
      border-color:var(--steen);
      font-weight:700;
    }

    button.btn.ghost{
      background:transparent;
    }

    button.btn.danger{
      color:var(--danger);
      border-color:var(--danger);
      background:transparent;
    }

    button.btn.info{
      color:var(--info);
      border-color:var(--info);
      background:transparent;
    }

    button.btn:disabled{
      opacity:0.4;
      cursor:not-allowed;
    }

    button.btn.small{
      padding:5px 10px;
      font-size:11px;
    }

    /* =========================================================
       PLAYER SWITCH
       ========================================================= */

    .player-switch{
      display:flex;
      gap:8px;
      margin-bottom:16px;
    }

    .player-switch button{
      flex:1;

      padding:12px;
      border-radius:10px;

      border:1px solid var(--border);
      background:var(--surface);
      color:var(--muted);

      font-family:'Oswald',sans-serif;
      text-transform:uppercase;
      letter-spacing:0.05em;

      cursor:pointer;
      font-size:14px;
    }

    .player-switch button.active.henrik{
      border-color:var(--henrik);
      color:var(--henrik);
      background:rgba(45,212,191,0.08);
    }

    .player-switch button.active.steen{
      border-color:var(--steen);
      color:var(--steen);
      background:rgba(255,183,3,0.08);
    }

    /* =========================================================
       MATCHES
       ========================================================= */

    .round-select{
      margin-bottom:16px;
    }

    .match-card{
      border:1px solid var(--border);
      border-radius:10px;
      padding:14px;
      margin-bottom:10px;
      background:var(--surface-2);
    }

    .match-card.locked{
      opacity:0.9;
    }

    .match-teams{
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:8px;
      margin-bottom:10px;
    }

    .match-teams .team{
      font-family:'Oswald',sans-serif;
      font-size:14.5px;
    }

    .match-teams .team.away{
      text-align:right;
    }

    .score-inputs{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }

    .score-inputs .dash{
      color:var(--muted);
      font-family:'Roboto Mono',monospace;
    }

    .scorer-inputs{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .scorer-inputs .field label{
      display:block;
      font-size:11px;
      color:var(--muted);
      margin-bottom:4px;
      text-transform:uppercase;
      letter-spacing:0.04em;
    }

    .scorer-inputs select{
      width:100%;
    }

    .match-footer{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:10px;
      padding-top:10px;
      border-top:1px dashed var(--border);
      gap:10px;
      flex-wrap:wrap;
    }

    .badge{
      font-size:11px;
      padding:3px 9px;
      border-radius:999px;
      border:1px solid var(--border);
      color:var(--muted);
    }

    .badge.locked{
      color:var(--danger);
      border-color:var(--danger);
    }

    .badge.points{
      color:#1a1400;
      background:var(--steen);
      border-color:var(--steen);
      font-weight:700;
    }

    .badge.points.zero{
      background:transparent;
      color:var(--muted);
    }

    /* =========================================================
       RESULTS
       ========================================================= */

    .result-card{
      border:1px solid var(--border);
      border-radius:10px;
      padding:14px;
      margin-bottom:10px;
      background:var(--surface-2);
    }

    .topscorer-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      margin-top:10px;
    }

    .topscorer-grid h4{
      font-size:11px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:0.05em;
      margin:0 0 6px;
    }

    .ts-row{
      display:flex;
      gap:6px;
      margin-bottom:6px;
    }

    .ts-row select{
      flex:1;
      min-width:0;
    }

    .ts-row input[type=number]{
      width:52px;
    }

    /* =========================================================
       STANDINGS
       ========================================================= */

    table.stand{
      width:100%;
      border-collapse:collapse;
      margin-top:6px;
    }

    table.stand th,
    table.stand td{
      padding:8px 10px;
      text-align:left;
      border-bottom:1px solid var(--border);
      font-size:13.5px;
    }

    table.stand th{
      color:var(--muted);
      font-weight:600;
      text-transform:uppercase;
      font-size:11px;
      letter-spacing:0.04em;
    }

    table.stand td.num{
      font-family:'Roboto Mono',monospace;
      text-align:right;
    }

    .bars{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-top:14px;
    }

    .bar-row{
      display:grid;
      grid-template-columns:80px 1fr 40px;
      align-items:center;
      gap:8px;
      font-size:12px;
    }

    .bar-track{
      background:var(--surface-2);
      border-radius:6px;
      overflow:hidden;
      height:10px;
      position:relative;
      border:1px solid var(--border);
    }

    .bar-fill{
      height:100%;
      border-radius:6px;
    }

    /* =========================================================
       ROUNDS
       ========================================================= */

    .round-block{
      border:1px solid var(--border);
      border-radius:10px;
      margin-bottom:10px;
      background:var(--surface-2);
    }

    .round-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:12px 14px;
      cursor:pointer;
      gap:10px;
    }

    .round-header h3{
      font-size:14.5px;
    }

    .round-body{
      padding:0 14px 14px;
      display:none;
    }

    .round-body.open{
      display:block;
    }

    .mini-match{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:7px 0;
      border-bottom:1px solid var(--border);
      font-size:13.5px;
      gap:10px;
    }

    .mini-match:last-child{
      border-bottom:none;
    }

    .add-match-row{
      display:flex;
      gap:8px;
      align-items:center;
      margin-top:10px;
      flex-wrap:wrap;
    }

    /* =========================================================
       SETTINGS
       ========================================================= */

    .teams-list{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:10px;
    }

    .team-settings-card{
      background:var(--surface-2);
      border:1px solid var(--border);
      border-radius:9px;
      overflow:hidden;
    }

    .team-settings-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding:9px;
      cursor:pointer;
    }

    .team-settings-header:hover{
      background:rgba(255,255,255,0.025);
    }

    .team-settings-title{
      display:flex;
      align-items:center;
      gap:8px;
      min-width:0;
      flex:1;
    }

    .team-settings-title input{
      flex:1;
      min-width:0;
    }

    .team-settings-count{
      color:var(--muted);
      font-size:11px;
      white-space:nowrap;
    }

    .team-settings-body{
      display:none;
      border-top:1px solid var(--border);
      padding:10px;
    }

    .team-settings-body.open{
      display:block;
    }

    .players-list{
      display:flex;
      flex-direction:column;
      gap:7px;
    }

    .player-edit-row{
      display:grid;
      grid-template-columns:48px 1fr 130px auto;
      gap:7px;
      align-items:center;

      background:var(--surface);
      border:1px solid var(--border);
      border-radius:8px;
      padding:7px;
    }

    .player-photo{
      width:48px;
      height:48px;
      border-radius:7px;
      object-fit:cover;
      background:var(--surface-3);
      border:1px solid var(--border);
    }

    .player-photo-placeholder{
      width:48px;
      height:48px;
      border-radius:7px;
      background:var(--surface-3);
      border:1px solid var(--border);

      display:flex;
      align-items:center;
      justify-content:center;

      color:var(--muted);
      font-family:'Oswald',sans-serif;
      font-size:17px;
    }

    .player-fields{
      display:grid;
      grid-template-columns:1fr 130px;
      gap:7px;
      min-width:0;
    }

    .player-fields input,
    .player-fields select{
      width:100%;
      min-width:0;
    }

    .player-actions{
      display:flex;
      gap:5px;
      align-items:center;
      justify-content:flex-end;
    }

    .player-add-box{
      margin-top:9px;
      padding-top:9px;
      border-top:1px dashed var(--border);
    }

    .player-add-fields{
      display:grid;
      grid-template-columns:1fr 130px auto;
      gap:7px;
    }

    .player-add-fields input,
    .player-add-fields select{
      width:100%;
      min-width:0;
    }

    .photo-upload-label{
      display:inline-flex;
      align-items:center;
      justify-content:center;

      padding:6px 9px;
      border:1px solid var(--border);
      border-radius:6px;

      color:var(--muted);
      background:var(--surface-3);

      font-family:'Oswald',sans-serif;
      font-size:10px;
      text-transform:uppercase;

      cursor:pointer;
    }

    .photo-upload-label:hover{
      border-color:var(--steen);
      color:var(--text);
    }

    .photo-upload-input{
      display:none;
    }

    .player-preview{
      display:flex;
      align-items:center;
      gap:10px;
      margin-top:10px;
      padding:8px;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:8px;
    }

    .player-preview img{
      width:46px;
      height:46px;
      object-fit:cover;
      border-radius:7px;
    }

    .settings-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      margin-top:10px;
    }

    .settings-field label{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-bottom:5px;
    }

    .settings-field input{
      width:80px;
    }

    /* =========================================================
       EMPTY / FOOTER
       ========================================================= */

    .empty{
      color:var(--muted);
      font-size:13.5px;
      padding:18px;
      text-align:center;
      border:1px dashed var(--border);
      border-radius:10px;
    }

    .footer-note{
      color:var(--muted);
      font-size:12px;
      text-align:center;
      margin-top:30px;
      line-height:1.6;
    }

    .footer-note a{
      color:var(--henrik);
    }

    /* =========================================================
       TOAST
       ========================================================= */

    .toast{
      position:fixed;
      bottom:18px;
      left:50%;

      transform:translateX(-50%);

      background:var(--surface-3);
      border:1px solid var(--steen);
      color:var(--text);

      padding:9px 18px;
      border-radius:8px;

      font-size:13px;

      opacity:0;
      pointer-events:none;

      transition:
        opacity .25s,
        transform .25s;

      z-index:50;
    }

    .toast.show{
      opacity:1;
      transform:translateX(-50%) translateY(-6px);
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media(max-width:700px){

      .player-edit-row{
        grid-template-columns:48px 1fr auto;
      }

      .player-fields{
        grid-column:2 / 4;
        grid-row:2;
        grid-template-columns:1fr 1fr;
      }

      .player-actions{
        grid-column:3;
        grid-row:1;
      }

      .player-add-fields{
        grid-template-columns:1fr 1fr;
      }

      .player-add-fields button{
        grid-column:1 / -1;
      }
    }

    @media(max-width:560px){

      .scoreboard-panel{
        grid-template-columns:1fr;
        text-align:center;
      }

      .sb-vs{
        order:3;
      }

      .topscorer-grid{
        grid-template-columns:1fr;
      }

      .settings-grid{
        grid-template-columns:1fr;
      }

      .teams-list{
        grid-template-columns:1fr;
      }

      .scorer-inputs{
        grid-template-columns:1fr;
      }

      .match-teams{
        grid-template-columns:1fr;
        text-align:center;
      }

      .match-teams .team.away{
        text-align:center;
      }

      .score-inputs{
        order:2;
      }

      .match-teams .team:first-child{
        order:1;
      }

      .match-teams .team.away{
        order:3;
      }

      .player-add-fields{
        grid-template-columns:1fr;
      }

      .player-add-fields button{
        grid-column:auto;
      }

      .player-fields{
        grid-template-columns:1fr;
      }

      .player-edit-row{
        grid-template-columns:48px 1fr auto;
      }
    }
  </style>
</head>

<body>

<header class="top">

  <div class="brand">

    <h1>
      Håndbold<span>Tips</span> 26/27
    </h1>

    <div
      class="sync-pill off"
      id="syncPill"
    >
      <span class="sync-dot"></span>
      <span id="syncLabel">
        Lokal lagring
      </span>
    </div>

  </div>

  <div class="scoreboard">

    <div class="scoreboard-panel">

      <div class="sb-player henrik">

        <div class="name">
          Henrik
        </div>

        <div
          class="pts mono"
          id="sbHenrik"
        >
          0
        </div>

      </div>

      <div class="sb-vs">
        VS
      </div>

      <div class="sb-player steen">

        <div class="name">
          Steen
        </div>

        <div
          class="pts mono"
          id="sbSteen"
        >
          0
        </div>

      </div>

    </div>

  </div>

  <nav
    class="tabs"
    id="tabs"
  >

    <button
      data-tab="predictions"
      class="active"
    >
      Forudsigelser
    </button>

    <button data-tab="rounds">
      Runder &amp; Kampe
    </button>

    <button data-tab="results">
      Resultater
    </button>

    <button data-tab="standings">
      Stilling
    </button>

    <button data-tab="settings">
      Indstillinger
    </button>

  </nav>

</header>

<main id="app"></main>

<div
  class="toast"
  id="toast"
></div>

<script src="config.js"></script>

<script>

/* =========================================================
   HÅNDBOLD TIPS 2026/27
   ========================================================= */

    Date.now().toString(36) +
    Math.random().toString(36).slice(2,7);

}

  return {

    teams: DEFAULT_TEAMS.map(name => ({

/* =========================================================
   DATA MIGRATION
   ========================================================= */

function migrateData(){

  let changed = false;

  if(!Array.isArray(data.teams)){

    data.teams = [];

    changed = true;

  }


  data.teams.forEach(team => {

    if(!Array.isArray(team.players)){

      team.players = [];

      changed = true;

    }

  });


  if(!data.predictions){

    data.predictions = {
      henrik:{},
      steen:{}
    };

    changed = true;

  }


  if(!data.predictions.henrik){

    data.predictions.henrik = {};

    changed = true;

  }


  if(!data.predictions.steen){

    data.predictions.steen = {};

    changed = true;

  }


  if(!data.settings){

    data.settings = {
      winner:2,
      exact:1,
      bonus:3,
      topscorer:1
    };

    changed = true;

  }


  if(changed){

    data.updatedAt = Date.now();

  }

}


migrateData();


/* =========================================================
   LOCAL STORAGE
   ========================================================= */

function loadLocal(){

  try{

    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );

    if(!raw){

      /*
       * Try the old version too.
       */
      const oldRaw =
        localStorage.getItem(
          'hbpredictor_v1'
        );

      if(!oldRaw){
        return null;
      }

      return JSON.parse(oldRaw);
    }

    return JSON.parse(raw);

  }catch(e){

    console.error(
      'Could not load local data:',
      e
    );

    return null;

  }

}


function saveLocal(){

  data.updatedAt = Date.now();

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


/* =========================================================
   FIREBASE
   ========================================================= */

let fbEnabled = false;

let fbDoc = null;

let fbStorage = null;

let fbSaveTimer = null;

let fbApplyingRemote = false;


async function initFirebase(){

  if(
    !window.FIREBASE_CONFIG ||
    !window.FIREBASE_CONFIG.apiKey
  ){

    setSyncStatus(
      false,
      'Lokal lagring'
    );

    return;
  }


  try{

    /*
     * Firebase Core
     */
    await loadScript(
      'https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js'
    );


    /*
     * Authentication
     */
    await loadScript(
      'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js'
    );


    /*
     * Firestore
     */
    await loadScript(
      'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js'
    );


    /*
     * Firebase Storage
     */
    await loadScript(
      'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js'
    );


    /*
     * Initialize Firebase
     */
    if(!firebase.apps.length){

      firebase.initializeApp(
        window.FIREBASE_CONFIG
      );

    }


    const auth =
      firebase.auth();

    const db =
      firebase.firestore();

    fbStorage =
      firebase.storage();


    setSyncStatus(
      false,
      'Logger ind...'
    );


    /*
     * Anonymous login
     */
    await auth.signInAnonymously();


    /*
     * Shared Firestore document
     */
    fbDoc =
      db
        .collection('handball-predictor')
        .doc('shared');


    /*
     * Listen for live updates
     */
    fbDoc.onSnapshot(

      snap => {

        if(!snap.exists){

          fbDoc
            .set(data)
            .then(() => {

              setSyncStatus(
                true,
                'Synkroniseret'
              );

            })
            .catch(error => {

              console.error(
                'Initial Firestore write failed:',
                error
              );

              setSyncStatus(
                false,
                'Sync-fejl'
              );

            });

          return;
        }


        const remote =
          snap.data();


        if(
          remote &&
          remote.updatedAt &&
          remote.updatedAt !== data.updatedAt
        ){

          fbApplyingRemote = true;

          data = remote;

          migrateData();

          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(data)
          );

          render();

          fbApplyingRemote = false;

        }


        setSyncStatus(
          true,
          'Synkroniseret'
        );

      },

      error => {

        console.error(
          'Firestore snapshot error:',
          error
        );

        setSyncStatus(
          false,
          'Sync-fejl'
        );

      }

    );


    fbEnabled = true;


    setSyncStatus(
      true,
      'Synkroniseret'
    );


  }catch(error){

    console.error(
      'Firebase initialization error:',
      error
    );

    setSyncStatus(
      false,
      'Sync ikke tilgængelig'
    );

  }

}


/* =========================================================
   DYNAMIC SCRIPT
   ========================================================= */

function loadScript(src){

  return new Promise(
    (resolve,reject) => {

      /*
       * Don't load the same script twice.
       */
      const existing =
        document.querySelector(
          `script[src="${src}"]`
        );

      if(existing){

        existing.addEventListener(
          'load',
          resolve,
          {once:true}
        );

        return;
      }


      const script =
        document.createElement(
          'script'
        );

      script.src = src;

      script.onload = resolve;

      script.onerror = reject;

      document.head.appendChild(
        script
      );

    }
  );

}


/* =========================================================
   SYNC STATUS
   ========================================================= */

function setSyncStatus(
  on,
  label
){

  const pill =
    document.getElementById(
      'syncPill'
    );

  if(!pill){
    return;
  }

  pill.classList.toggle(
    'on',
    on
  );

  pill.classList.toggle(
    'off',
    !on
  );

  document.getElementById(
    'syncLabel'
  ).textContent = label;

}


/* =========================================================
   PERSIST
   ========================================================= */

function persist(){

  saveLocal();


  if(
    fbEnabled &&
    fbDoc &&
    !fbApplyingRemote
  ){

    clearTimeout(
      fbSaveTimer
    );


    fbSaveTimer =
      setTimeout(
        () => {

          fbDoc
            .set(data)
            .then(() => {

              setSyncStatus(
                true,
                'Synkroniseret'
              );

            })
            .catch(error => {

              console.error(
                'Firestore write failed:',
                error
              );

              setSyncStatus(
                false,
                'Sync-fejl'
              );

            });

        },
        400
      );

  }

}

async function uploadPlayerPhoto(
  teamId,
  playerId,
  file
){

  if(!fbStorage){

    throw new Error(
      'Firebase Storage er ikke tilgængelig.'
    );

  }


  if(!file.type.startsWith('image/')){

    throw new Error(
      'Filen skal være et billede.'
    );

  }


  /*
   * Limit to 5 MB.
   */
  if(file.size > 5 * 1024 * 1024){

    throw new Error(
      'Billedet må højst være 5 MB.'
    );

  }


  const extension =
    file.name
      .split('.')
      .pop()
      .toLowerCase()
      .replace(/[^a-z0-9]/g,'');


  const path =
    `players/${teamId}/${playerId}.${extension}`;


  const ref =
    fbStorage.ref(path);


  await ref.put(
    file,
    {
      contentType:file.type
    }
  );


  return await ref.getDownloadURL();

}

function teamName(id){

  const team =
    data.teams.find(
      t => t.id === id
    );

  return team
    ? team.name
    : '?';

}


function getTeam(id){

  return data.teams.find(
    t => t.id === id
  );

}


function getPlayer(
  teamId,
  playerId
){

  const team =
    getTeam(teamId);

  if(!team){
    return null;
  }

  return (
    team.players || []
  ).find(
    p => p.id === playerId
  ) || null;

}


function getPlayerById(
  playerId
){

  for(const team of data.teams){

    const player =
      (team.players || [])
        .find(
          p => p.id === playerId
        );

    if(player){
      return player;
    }

  }

  return null;

}


function getRound(id){

  return data.rounds.find(
    r => r.id === id
  );

}


function getMatch(
  roundId,
  matchId
){

  const round =
    getRound(roundId);

  return round
    ? round.matches.find(
        m => m.id === matchId
      )
    : null;

}


function allMatches(){

  return data.rounds.flatMap(
    round =>
      round.matches.map(
        match => ({
          ...match,
          roundId:round.id,
          roundName:round.name
        })
      )
  );

}

/* =========================================================
   SCORING
   ========================================================= */

function computeMatchPoints(
  pred,
  result,
  settings
){

  if(
    !pred ||
    !result ||
    result.homeScore === null ||
    result.homeScore === undefined
  ){

    return {
      total:0,
      parts:[]
    };

  }


  const parts = [];

  let total = 0;


  /*
   * Winner
   */
  const predWinner =
    pred.homeScore > pred.awayScore
      ? 'home'
      : pred.homeScore < pred.awayScore
        ? 'away'
        : 'draw';


  const actWinner =
    result.homeScore > result.awayScore
      ? 'home'
      : result.homeScore < result.awayScore
        ? 'away'
        : 'draw';


  if(predWinner === actWinner){

    total += settings.winner;

    parts.push(
      'Rigtig vinder +' +
      settings.winner
    );

  }


  /*
   * Exact goals
   */
  let exactCount = 0;


  if(
    pred.homeScore ===
    result.homeScore
  ){

    total += settings.exact;

    exactCount++;

    parts.push(
      'Præcist hjemme-antal +' +
      settings.exact
    );

  }


  if(
    pred.awayScore ===
    result.awayScore
  ){

    total += settings.exact;

    exactCount++;

    parts.push(
      'Præcist ude-antal +' +
      settings.exact
    );

  }


  /*
   * Perfect score
   */
  if(exactCount === 2){

    total += settings.bonus;

    parts.push(
      'Fuld pletskud-bonus +' +
      settings.bonus
    );

  }


  /*
   * Topscorers
   *
   * New format:
   *   pred.homeScorerId
   *
   * Old format:
   *   pred.homeScorer
   *
   * This keeps old data working.
   */

  const homeScorers =
    result.homeScorers || [];

  const awayScorers =
    result.awayScorers || [];


  if(pred.homeScorerId){

    const correct =
      homeScorers.some(
        s =>
          s.playerId ===
          pred.homeScorerId
      );


    if(correct){

      total += settings.topscorer;

      parts.push(
        'Topscorer hjemme +' +
        settings.topscorer
      );

    }

  }else if(pred.homeScorer){

    const correct =
      homeScorers.some(
        s =>
          normalizeName(
            s.name
          ) ===
          normalizeName(
            pred.homeScorer
          )
      );


    if(correct){

      total += settings.topscorer;

      parts.push(
        'Topscorer hjemme +' +
        settings.topscorer
      );

    }

  }


  if(pred.awayScorerId){

    const correct =
      awayScorers.some(
        s =>
          s.playerId ===
          pred.awayScorerId
      );


    if(correct){

      total += settings.topscorer;

      parts.push(
        'Topscorer ude +' +
        settings.topscorer
      );

    }

  }else if(pred.awayScorer){

    const correct =
      awayScorers.some(
        s =>
          normalizeName(
            s.name
          ) ===
          normalizeName(
            pred.awayScorer
          )
      );


    if(correct){

      total += settings.topscorer;

      parts.push(
        'Topscorer ude +' +
        settings.topscorer
      );

    }

  }


  return {
    total,
    parts
  };

}


function playerTotal(player){

  let total = 0;


  for(const m of allMatches()){

    if(!m.result){
      continue;
    }


    const pred =
      data.predictions[player][m.id];


    total +=
      computeMatchPoints(
        pred,
        m.result,
        data.settings
      ).total;

  }


  return total;

}


function playerTotalByRound(
  player,
  roundId
){

  const round =
    getRound(roundId);

  if(!round){
    return 0;
  }


  let total = 0;


  for(const m of round.matches){

    if(!m.result){
      continue;
    }


    const pred =
      data.predictions[player][m.id];


    total +=
      computeMatchPoints(
        pred,
        m.result,
        data.settings
      ).total;

  }


  return total;

}

function renderPredictions(){

  if(
    !predRoundId &&
    data.rounds.length
  ){

    predRoundId =
      data.rounds[0].id;

  }


  const roundOptions =
    data.rounds
      .map(
        r =>
          `<option value="${escapeHtml(r.id)}" ${
            r.id === predRoundId
              ? 'selected'
              : ''
          }>
            ${escapeHtml(r.name)}
          </option>`
      )
      .join('');


  if(!data.rounds.length){

    return `

      <div class="player-switch">
        ${playerBtn('henrik')}
        ${playerBtn('steen')}
      </div>

      <div class="empty">

        Ingen runder oprettet endnu.

        Gå til
        <strong>Runder &amp; Kampe</strong>
        for at oprette den første runde
        og tilføje kampe.

      </div>

    `;

  }


  const round =
    getRound(predRoundId);


  if(!round){

    return `
      <div class="empty">
        Vælg en gyldig runde.
      </div>
    `;

  }


  const matchesHtml =
    round.matches.length

      ? round.matches
          .map(
            m =>
              renderPredictionMatch(m)
          )
          .join('')

      : `

        <div class="empty">
          Denne runde har ingen kampe endnu.
        </div>

      `;


  return `

    <div class="player-switch">

      ${playerBtn('henrik')}

      ${playerBtn('steen')}

    </div>


    <div class="card round-select">

      <div class="row between">

        <div>

          <h2>
            Vælg runde
          </h2>

          <div class="subtle">

            Forudsigelser for

            <strong
              style="color:var(--${activePlayer})"
            >
              ${
                activePlayer === 'henrik'
                  ? 'Henrik'
                  : 'Steen'
              }
            </strong>

          </div>

        </div>


        <select id="predRoundSelect">

          ${roundOptions}

        </select>

      </div>

    </div>


    ${matchesHtml}

  `;

}


function playerBtn(p){

  const label =
    p === 'henrik'
      ? 'Henrik'

  return `

    <button
      data-player="${p}"
      class="${
        activePlayer === p
          ? 'active ' + p
          : ''
      }"
    >
      ${label}
    </button>

  `;

}


function playerOptions(
  teamId,
  selectedId
){

  const team =
    getTeam(teamId);


  if(!team){

    return `
      <option value="">
        Ingen spillere
      </option>
    `;

  }


  const players =
    team.players || [];


  if(!players.length){

    return `
      <option value="">
        Ingen spillere tilføjet
      </option>
    `;

  }


  return `

    <option value="">
      Vælg spiller
    </option>

    ${
      players
        .map(
          p =>
            `
              <option
                value="${escapeHtml(p.id)}"
                ${
                  p.id === selectedId
                    ? 'selected'
                    : ''
                }
              >
                ${escapeHtml(p.name)}
                ${
                  p.position
                    ? ' – ' +
                      escapeHtml(
                        p.position
                      )
                    : ''
                }
              </option>
            `
        )
        .join('')
    }

  `;

}

    !!m.result;


  const pts =
    locked
      ? computeMatchPoints(
          pred,
          m.result,
          data.settings
        )
      : null;


  return `

    <div
      class="match-card ${
        locked ? 'locked' : ''
      }"
    >

      <div class="match-teams">

        <div class="team">

          ${escapeHtml(
            teamName(
              m.homeTeamId
            )
          )}

        </div>


        <div class="score-inputs">

          <input
            type="number"
            min="0"
            data-mid="${m.id}"
            data-field="homeScore"
            value="${
              pred.homeScore ?? ''
            }"
            ${locked ? 'disabled' : ''}
          >

          <span class="dash">
            –
          </span>

          <input
            type="number"
            min="0"
            data-mid="${m.id}"
            data-field="awayScore"
            value="${
              pred.awayScore ?? ''
            }"
            ${locked ? 'disabled' : ''}
          >

        </div>


        <div class="team away">

          ${escapeHtml(
            teamName(
              m.awayTeamId
            )
          )}

        </div>

      </div>


      <div class="scorer-inputs">

        <div class="field">

          <label>
            Topscorer,
            ${escapeHtml(
              teamName(
                m.homeTeamId
              )
            )}
          </label>

          <select
            data-mid="${m.id}"
            data-field="homeScorerId"
            ${locked ? 'disabled' : ''}
          >

            ${playerOptions(
              m.homeTeamId,
              pred.homeScorerId
            )}

          </select>

        </div>


        <div class="field">

          <label>
            Topscorer,
            ${escapeHtml(
              teamName(
                m.awayTeamId
              )
            )}
          </label>

          <select
            data-mid="${m.id}"
            data-field="awayScorerId"
            ${locked ? 'disabled' : ''}
          >

            ${playerOptions(
              m.awayTeamId,
              pred.awayScorerId
            )}

          </select>

        </div>

      </div>


      <div class="match-footer">

        ${
          locked

            ? `

              <span class="badge locked">

                Låst – resultat:
                ${m.result.homeScore}–${m.result.awayScore}

              </span>

            `

            : `

              <span class="badge">

                Åben for forudsigelse

              </span>

            `
        }


        ${
          locked

            ? `

              <span
                class="badge points ${
                  pts.total === 0
                    ? 'zero'
                    : ''
                }"
              >
                ${pts.total} point
              </span>

            `

            : ''

        }

      </div>

    </div>

  `;

}

function nextRoundName(){

  const n =
    data.rounds.filter(
      r =>
        /^Runde \d+$/.test(
          r.name
        )
    ).length;


  return 'Runde ' +
    (n + 1);

function renderResults(){

  if(
    !resultRoundId &&
    data.rounds.length
  ){

    resultRoundId =
      data.rounds[0].id;

  }


  if(!data.rounds.length){

    return `

      <div class="empty">

        Opret runder og kampe under
        <strong>Runder &amp; Kampe</strong>
        først.

      </div>

    `;

  }


  const roundOptions =
    data.rounds
      .map(
        r =>
          `
            <option
              value="${escapeHtml(r.id)}"
              ${
                r.id === resultRoundId
                  ? 'selected'
                  : ''
              }
            >
              ${escapeHtml(r.name)}
            </option>
          `
      )
      .join('');


  const round =
    getRound(
      resultRoundId
    );


  if(!round){

    return `
      <div class="empty">
        Vælg en gyldig runde.
      </div>
    `;

  }


  const matchesHtml =
    round.matches.length

      ? round.matches
          .map(
            m =>
              renderResultMatch(
                round,
                m
              )
          )
          .join('')

      : `

        <div class="empty">

          Denne runde har ingen kampe endnu.

        </div>

      `;


  return `

    <div class="card">

      <div class="row between">

        <h2>
          Indtast resultater
        </h2>

        <select id="resultRoundSelect">

          ${roundOptions}

        </select>

      </div>

    </div>

    ${matchesHtml}

  `;

}


function resultScorerOptions(
  teamId,
  scorer
){

  /*
   * Prefer the player ID.
   *
   * For old results where only a name
   * exists, attempt to match the name.
   */

  const selectedId =
    scorer?.playerId || '';


  const selectedName =
    scorer?.name || '';


  const team =
    getTeam(
      teamId
    );


  const players =
    team?.players || [];


  if(!players.length){

    return `
      <option value="">
        Ingen spillere tilføjet
      </option>
    `;

  }


  let html = `
    <option value="">
      Vælg spiller
    </option>
  `;


  players.forEach(
    p => {

      const selected =
        selectedId
          ? p.id === selectedId
          : normalizeName(
              p.name
            ) ===
            normalizeName(
              selectedName
            );


      html += `

        <option
          value="${escapeHtml(p.id)}"
          ${
            selected
              ? 'selected'
              : ''
          }
        >
          ${escapeHtml(p.name)}
          ${
            p.position
              ? ' – ' +
                escapeHtml(
                  p.position
                )
              : ''
          }
        </option>

      `;

    }
  );


  return html;

}

/* =========================================================
   HTML ESCAPING
   ========================================================= */

function escapeHtml(str){

  return String(
    str ?? ''
  )
    .replace(
      /[&<>"']/g,
      c =>
        ({
          '&':'&amp;',
          '<':'&lt;',
          '>':'&gt;',
          '"':'&quot;',
          "'":'&#39;'
        }[c])
    );

}


/* =========================================================
   EVENT HANDLING
   ========================================================= */

function attachHandlers(){

  /* =======================================================
     PREDICTIONS
     ======================================================= */

  if(activeTab === 'predictions'){

    document
      .querySelectorAll(
        '[data-player]'
      )
      .forEach(
        btn => {

          btn.addEventListener(
            'click',
            () => {

              activePlayer =
                btn.dataset.player;

              render();

            }
          );

        }
      );


    const sel =
      document.getElementById(
        'predRoundSelect'
      );


    if(sel){

      sel.addEventListener(
        'change',
        () => {

          predRoundId =
            sel.value;

          render();

        }
      );

    }


    document
      .querySelectorAll(
        '[data-mid]'
      )
      .forEach(
        inp => {

          inp.addEventListener(
            'change',
            () => {

              const mid =
                inp.dataset.mid;

              const field =
                inp.dataset.field;


              const p =
                data.predictions[
                  activePlayer
                ];


              if(!p[mid]){

                p[mid] = {};

              }


              let val =
                inp.value;


              if(
                field === 'homeScore' ||
                field === 'awayScore'
              ){

                val =
                  val === ''
                    ? null
                    : parseInt(
                        val,
                        10
                      );

              }


              /*
               * New player dropdown format.
               */
              if(
                field ===
                  'homeScorerId' ||
                field ===
                  'awayScorerId'
              ){

                p[mid][field] =
                  val || null;


                /*
                 * Keep the old name fields
                 * synchronized too. This makes
                 * exported data easier to read and
                 * preserves compatibility.
                 */
                const teamId =
                  field ===
                    'homeScorerId'
                    ? getMatchById(
                        mid
                      )?.homeTeamId
                    : getMatchById(
                        mid
                      )?.awayTeamId;


                const player =
                  teamId && val
                    ? getPlayer(
                        teamId,
                        val
                      )
                    : null;


                const nameField =
                  field ===
                    'homeScorerId'
                    ? 'homeScorer'
                    : 'awayScorer';


                p[mid][nameField] =
                  player
                    ? player.name
                    : '';

              }else{

                p[mid][field] =
                  val;

              }


              persist();

              render();

            }
          );

        }
      );

  }


  /* =======================================================
     ROUNDS
     ======================================================= */

  if(activeTab === 'rounds'){

    document
      .querySelectorAll(
        '[data-toggle-round]'
      )
      .forEach(
        el => {

          el.addEventListener(
            'click',
            e => {

              if(
                e.target.closest(
                  'button'
                )
              ){

                return;

              }


              const id =
                el.dataset.toggleRound;


              if(
                openRounds.has(id)
              ){

                openRounds.delete(id);

              }else{

                openRounds.add(id);

              }


              render();

            }
          );

        }
      );


    const addRoundBtn =
      document.getElementById(
        'addRoundBtn'
      );


    if(addRoundBtn){

      addRoundBtn.addEventListener(
        'click',
        () => {

          const name =
            document
              .getElementById(
                'newRoundName'
              )
              .value
              .trim() ||
            nextRoundName();


          const r = {

            id:uid('r'),

            name,

            matches:[]

          };


          data.rounds.push(r);

          openRounds.add(
            r.id
          );

          persist();

          render();

        }
      );

    }


    document
      .querySelectorAll(
        '[data-del-round]'
      )
      .forEach(
        btn => {

          btn.addEventListener(
            'click',
            () => {

              if(
                !confirm(
                  'Slet denne runde og alle dens kampe?'
                )
              ){

                return;

              }


              data.rounds =
                data.rounds.filter(
                  r =>
                    r.id !==
                    btn.dataset.delRound
                );


              if(
                predRoundId ===
                btn.dataset.delRound
              ){

                predRoundId =
                  data.rounds[0]?.id ||
                  null;

              }


              if(
                resultRoundId ===
                btn.dataset.delRound
              ){

                resultRoundId =
                  data.rounds[0]?.id ||
                  null;

              }


              persist();

              render();

            }
          );

        }
      );


    document
      .querySelectorAll(
        '[data-add-match]'
      )
      .forEach(
        btn => {

          btn.addEventListener(
            'click',
            () => {

              const rid =
                btn.dataset.addMatch;


              const homeSel =
                document.querySelector(
                  `[data-home-select="${rid}"]`
                );


              const awaySel =
                document.querySelector(
                  `[data-away-select="${rid}"]`
                );


              if(
                !homeSel.value ||
                !awaySel.value
              ){

                toast(
                  'Vælg begge hold'
                );

                return;

              }


              if(
                homeSel.value ===
                awaySel.value
              ){

                toast(
                  'Hold kan ikke møde sig selv'
                );

                return;

              }


              const r =
                getRound(rid);


              if(!r){
                return;
              }


              r.matches.push({

                id:uid('m'),

                homeTeamId:
                  homeSel.value,

                awayTeamId:
                  awaySel.value,

                result:null

              });


              persist();

              render();

            }
          );

        }
      );


    document
      .querySelectorAll(
        '[data-del-match]'
      )
      .forEach(
        btn => {

          btn.addEventListener(
            'click',
            () => {

              const [
                rid,
                mid
              ] =
                btn.dataset.delMatch
                  .split('|');


              const r =
                getRound(rid);


              if(!r){
                return;
              }


              r.matches =
                r.matches.filter(
                  m =>
                    m.id !== mid
                );


              persist();

              render();

            }
          );

        }
      );

  }


  /* =======================================================
     RESULTS
     ======================================================= */

  if(activeTab === 'results'){

    const sel =
      document.getElementById(
        'resultRoundSelect'
      );


    if(sel){

      sel.addEventListener(
        'change',
        () => {

          resultRoundId =
            sel.value;

          render();

        }
      );

    }


    document
      .querySelectorAll(
        '[data-save-result]'
      )
      .forEach(
        btn => {

          btn.addEventListener(
            'click',
            () => {

              const [
                rid,
                mid
              ] =
                btn.dataset.saveResult
                  .split('|');


              const card =
                btn.closest(
                  '.result-card'
                );


              const homeScore =
                parseInt(
                  card.querySelector(
                    '[data-rfield="homeScore"]'
                  ).value,
                  10
                );


              const awayScore =
                parseInt(
                  card.querySelector(
                    '[data-rfield="awayScore"]'
                  ).value,
                  10
                );


              if(
                isNaN(homeScore) ||
                isNaN(awayScore)
              ){

                toast(
                  'Udfyld begge måltal'
                );

                return;

              }


              const m =
                getMatch(
                  rid,
                  mid
                );


              if(!m){
                return;
              }


              const homeScorers =
                [0,1]
                  .map(
                    i => {

                      const playerId =
                        card
                          .querySelector(
                            `[data-scorer="home-${i}-player"]`
                          )
                          .value;


                      const goals =
                        card
                          .querySelector(
                            `[data-scorer="home-${i}-goals"]`
                          )
                          .value;


                      const player =
                        playerId
                          ? getPlayer(
                              m.homeTeamId,
                              playerId
                            )
                          : null;


                      return {

                        playerId:
                          playerId || '',

                        name:
                          player
                            ? player.name
                            : '',

                        goals

                      };

                    }
                  )
                  .filter(
                    s =>
                      s.playerId
                  );


              const awayScorers =
                [0,1]
                  .map(
                    i => {

                      const playerId =
                        card
                          .querySelector(
                            `[data-scorer="away-${i}-player"]`
                          )
                          .value;


                      const goals =
                        card
                          .querySelector(
                            `[data-scorer="away-${i}-goals"]`
                          )
                          .value;


                      const player =
                        playerId
                          ? getPlayer(
                              m.awayTeamId,
                              playerId
                            )
                          : null;


                      return {

                        playerId:
                          playerId || '',

                        name:
                          player
                            ? player.name
                            : '',

                        goals

                      };

                    }
                  )
                  .filter(
                    s =>
                      s.playerId
                  );


              m.result = {

                homeScore,

                awayScore,

                homeScorers,

                awayScorers

              };


              persist();

              render();

              toast(
                'Resultat gemt'
              );

            }
          );

        }
      );


    document
      .querySelectorAll(
        '[data-clear-result]'
      )
      .forEach(
        btn => {

          btn.addEventListener(
            'click',
            () => {

              const [
                rid,
                mid
              ] =
                btn.dataset.clearResult
                  .split('|');


              const m =
                getMatch(
                  rid,
                  mid
                );


              if(!m){
                return;
              }


              m.result = null;


              persist();

              render();

            }
          );

        }
      );

  }


  /* =======================================================
     SETTINGS
     ======================================================= */

  if(activeTab === 'settings'){

    /*
     * Expand/collapse teams
     */
    document
      .querySelectorAll(
        '[data-toggle-team]'
      )
      .forEach(
        el => {

          el.addEventListener(
            'click',
            () => {

              const id =
                el.dataset.toggleTeam;


              if(
                openTeams.has(id)
              ){

                openTeams.delete(id);

              }else{

                openTeams.add(id);

              }


              render();

            }
          );

        }
      );


    /*
     * Team names
     */
    document
      .querySelectorAll(
        '[data-team-id]'
      )
      .forEach(
        inp => {

          inp.addEventListener(
            'change',
            () => {

              const t =
                data.teams.find(
                  t =>
                    t.id ===
                    inp.dataset.teamId
                );


              if(t){

                t.name =
                  inp.value.trim() ||
                  t.name;

                persist();

                render();

              }

            }
          );

        }
      );


    /*
     * Delete teams
     */
    document
      .querySelectorAll(
        '[data-del-team]'
      )
      .forEach(
        btn => {

          btn.addEventListener(
            'click',
            () => {

              if(
                !confirm(
                  'Fjern dette hold? Kampe, der allerede er oprettet med holdet, påvirkes ikke.'
                )
              ){

                return;

              }


              data.teams =
                data.teams.filter(
                  t =>
                    t.id !==
                    btn.dataset.delTeam
                );


              persist();

              render();

            }
          );

        }
      );


    /*
     * Add team
     */
    const addTeamBtn =
      document.getElementById(
        'addTeamBtn'
      );


    if(addTeamBtn){

      addTeamBtn.addEventListener(
        'click',
        () => {

          const inp =
            document.getElementById(
              'newTeamName'
            );


          const name =
            inp.value.trim();


          if(!name){
            return;
          }


          const team = {

            id:uid('t'),

            name,

            players:[]

          };


          data.teams.push(
            team
          );


          openTeams.add(
            team.id
          );


          persist();

          render();

        }
      );

    }


    /*
     * Add players
     */
    document
      .querySelectorAll(
        '[data-add-player]'
      )
      .forEach(
        btn => {

          btn.addEventListener(
            'click',
            () => {

              const teamId =
                btn.dataset.addPlayer;


              const nameInput =
                document.querySelector(
                  `[data-new-player-name="${teamId}"]`
                );


              const positionInput =
                document.querySelector(
                  `[data-new-player-position="${teamId}"]`
                );


              const name =
                nameInput.value.trim();


              if(!name){

                toast(
                  'Indtast spillerens navn'
                );

                return;

              }


              const team =
                getTeam(
                  teamId
                );


              if(!team){
                return;
              }


              if(
                (team.players || [])
                  .some(
                    p =>
                      normalizeName(
                        p.name
                      ) ===
                      normalizeName(
                        name
                      )
                  )
              ){

                toast(
                  'Denne spiller findes allerede'
                );

                return;

              }


              const player = {

                id:uid('p'),

                name,

                position:
                  positionInput.value ||
                  '',

                photoUrl:'',

                createdAt:
                  Date.now()

              };


              if(
                !Array.isArray(
                  team.players
                )
              ){

                team.players = [];

              }


              team.players.push(
                player
              );


              openTeams.add(
                teamId
              );


              persist();

              render();

              toast(
                'Spiller tilføjet'
              );

            }
          );

        }
      );


    /*
     * Player names
     */
    document
      .querySelectorAll(
        '[data-player-name]'
      )
      .forEach(
        inp => {

          inp.addEventListener(
            'change',
            () => {

              const [
                teamId,
                playerId
              ] =
                inp.dataset.playerName
                  .split('|');


              const player =
                getPlayer(
                  teamId,
                  playerId
                );


              if(!player){
                return;
              }


              const name =
                inp.value.trim();


              if(name){

                player.name =
                  name;

                persist();

              }

            }
          );

        }
      );


    /*
     * Player positions
     */
    document
      .querySelectorAll(
        '[data-player-position]'
      )
      .forEach(
        select => {

          select.addEventListener(
            'change',
            () => {

              const [
                teamId,
                playerId
              ] =
                select.dataset.playerPosition
                  .split('|');


              const player =
                getPlayer(
                  teamId,
                  playerId
                );


              if(!player){
                return;
              }


              player.position =
                select.value;


              persist();

            }
          );

        }
      );


    /*
     * Delete player
     */
    document
      .querySelectorAll(
        '[data-del-player]'
      )
      .forEach(
        btn => {

          btn.addEventListener(
            'click',
            () => {

              const [
                teamId,
                playerId
              ] =
                btn.dataset.delPlayer
                  .split('|');


              const team =
                getTeam(
                  teamId
                );


              if(!team){
                return;
              }


              const player =
                getPlayer(
                  teamId,
                  playerId
                );


              if(
                !player ||
                !confirm(
                  `Slet ${player.name}?`
                )
              ){

                return;

              }


              team.players =
                team.players.filter(
                  p =>
                    p.id !==
                    playerId
                );


              /*
               * Clear old predictions that
               * referenced this player.
               */
              for(
                const playerPredictions
                of Object.values(
                  data.predictions
                )
              ){

                for(
                  const pred
                  of Object.values(
                    playerPredictions
                  )
                ){

                  if(
                    pred.homeScorerId ===
                    playerId
                  ){

                    pred.homeScorerId =
                      null;

                    pred.homeScorer =
                      '';

                  }


                  if(
                    pred.awayScorerId ===
                    playerId
                  ){

                    pred.awayScorerId =
                      null;

                    pred.awayScorer =
                      '';

                  }

                }

              }


              persist();

              render();

            }
          );

        }
      );


    /*
     * Player photo upload
     */
    document
      .querySelectorAll(
        '[data-player-photo]'
      )
      .forEach(
        input => {

          input.addEventListener(
            'change',
            async () => {

              const file =
                input.files[0];


              if(!file){
                return;
              }


              const [
                teamId,
                playerId
              ] =
                input.dataset.playerPhoto
                  .split('|');


              const player =
                getPlayer(
                  teamId,
                  playerId
                );


              if(!player){
                return;
              }


              /*
               * If Firebase isn't available,
               * we cannot persist the image
               * between devices.
               */
              if(!fbStorage){

                alert(
                  'Firebase Storage er ikke tilgængelig. Kontroller at Firebase er korrekt konfigureret.'
                );

                input.value = '';

                return;

              }


              try{

                toast(
                  'Uploader foto...'
                );


                const url =
                  await uploadPlayerPhoto(
                    teamId,
                    playerId,
                    file
                  );


                player.photoUrl =
                  url;


                persist();

                render();

                toast(
                  'Foto gemt'
                );

              }catch(error){

                console.error(
                  'Photo upload failed:',
                  error
                );


                alert(
                  error.message ||
                  'Kunne ikke uploade billedet.'
                );

              }


              input.value = '';

            }
          );

        }
      );


    /*
     * Save points
     */
    const saveSettingsBtn =
      document.getElementById(
        'saveSettingsBtn'
      );


    if(saveSettingsBtn){

      saveSettingsBtn.addEventListener(
        'click',
        () => {

          data.settings = {

            winner:
              parseInt(
                document.getElementById(
                  'setWinner'
                ).value,
                10
              ) || 0,

            exact:
              parseInt(
                document.getElementById(
                  'setExact'
                ).value,
                10
              ) || 0,

            bonus:
              parseInt(
                document.getElementById(
                  'setBonus'
                ).value,
                10
              ) || 0,

            topscorer:
              parseInt(
                document.getElementById(
                  'setTopscorer'
                ).value,
                10
              ) || 0

          };


          persist();

          render();

          toast(
            'Pointsystem gemt'
          );

        }
      );

    }


    /* =====================================================
       EXPORT
       ===================================================== */

    const exportBtn =
      document.getElementById(
        'exportBtn'
      );


    if(exportBtn){

      exportBtn.addEventListener(
        'click',
        () => {

          const blob =
            new Blob(
              [
                JSON.stringify(
                  data,
                  null,
                  2
                )
              ],
              {
                type:
                  'application/json'
              }
            );


          const url =
            URL.createObjectURL(
              blob
            );


          const a =
            document.createElement(
              'a'
            );


          a.href =
            url;


          a.download =
            'haandboldtips-backup-' +
            new Date()
              .toISOString()
              .slice(0,10) +
            '.json';


          a.click();


          URL.revokeObjectURL(
            url
          );

        }
      );

    }


    /* =====================================================
       IMPORT
       ===================================================== */

    const importBtn =
      document.getElementById(
        'importBtn'
      );


    const importFile =
      document.getElementById(
        'importFile'
      );


    if(importBtn){

      importBtn.addEventListener(
        'click',
        () =>
          importFile.click()
      );

    }


    if(importFile){

      importFile.addEventListener(
        'change',
        () => {

          const file =
            importFile.files[0];


          if(!file){
            return;
          }


          const reader =
            new FileReader();


          reader.onload = () => {

            try{

              const parsed =
                JSON.parse(
                  reader.result
                );


              if(
                !parsed.teams ||
                !parsed.rounds ||
                !parsed.predictions
              ){

                throw new Error(
                  'bad format'
                );

              }


              data =
                parsed;


              migrateData();


              persist();

              render();

              toast(
                'Data importeret'
              );

            }catch(e){

              console.error(e);

              alert(
                'Kunne ikke læse filen. Sørg for det er en gyldig backup-fil.'
              );

            }

          };


          reader.readAsText(
            file
          );

        }
      );

    }


    /* =====================================================
       RESET
       ===================================================== */

    const resetBtn =
      document.getElementById(
        'resetBtn'
      );


    if(resetBtn){

      resetBtn.addEventListener(
        'click',
        () => {

          if(
            !confirm(
              'Dette sletter ALT data (hold, spillere, fotos, runder, resultater og forudsigelser). Er du sikker?'
            )
          ){

            return;

          }


          data =
            defaultData();


          predRoundId =
            null;


          resultRoundId =
            null;


          openRounds.clear();

          openTeams.clear();


          persist();

          render();

        }
      );

    }

  }

}


/* =========================================================
   FIND MATCH BY ID
   ========================================================= */

function getMatchById(
  matchId
){

  for(
    const round
    of data.rounds
  ){

    const match =
      round.matches.find(
        m =>
          m.id ===
          matchId
      );


    if(match){
      return match;
    }

  }


  return null;

}


/* =========================================================
   TAB NAVIGATION
   ========================================================= */

document
  .getElementById(
    'tabs'
  )
  .addEventListener(
    'click',
    e => {

      const btn =
        e.target.closest(
          'button[data-tab]'
        );


      if(!btn){
        return;
      }


      activeTab =
        btn.dataset.tab;


      document
        .querySelectorAll(
          '#tabs button'
        )
        .forEach(
          b =>
            b.classList.toggle(
              'active',
              b === btn
            )
        );


      render();

    }
  );


/* =========================================================
   BOOT
   ========================================================= */

render();

initFirebase();

</script>

</body>
</html>
